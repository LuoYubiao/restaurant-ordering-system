# ============================================================================
# build-packages.yml —— GitHub Actions 工作流：并行构建 macOS 与 Windows 分发包
# build-packages.yml -- Build the macOS and Windows packages in parallel
#
# 为什么必须分平台构建 / Why build per platform:
#   PyInstaller 不支持交叉编译，引导程序与 Python 运行时均与平台绑定，
#   因此 macOS 产物必须由 macos-latest 产出，Windows 产物必须由 windows-latest 产出。
#   PyInstaller cannot cross-compile: both the bootloader and the Python runtime
#   are platform specific, so each artifact must be built on its own runner.
#
# 为什么拆成两个 job 而不是 matrix / Why two jobs instead of a matrix:
#   GitHub Actions 的 ``shell`` 键不接受表达式（matrix 上下文不可用），
#   用两个 job 可以让 shell 保持为字面量，避免 ``Unrecognized named-value`` 报错。
#   The ``shell`` key does not accept expressions (the matrix context is
#   unavailable there), so two jobs keep ``shell`` literal.
#
# 产物 / Artifacts:
#   - restaurant-ordering-system-macos.zip    （macOS，arm64）
#   - restaurant-ordering-system-windows.zip  （Windows，x64）
# ============================================================================
name: Build Packages

# 触发方式 / Triggers:
#   - workflow_dispatch：在 Actions 页面手动点击运行
#     workflow_dispatch: run manually from the Actions tab
#   - push tags v*：打 tag 时自动出包
#     push tags v*: build automatically when a version tag is pushed
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # macOS 产物 / macOS artifact
  build-macos:
    name: Build macOS package
    runs-on: macos-latest

    steps:
      # 拉取源码 / Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装与本地一致的 Python 版本 / Install the same Python version as local
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 安装运行与打包依赖 / Install runtime and packaging dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      # 执行 macOS 一键打包脚本 / Run the macOS packaging script
      - name: Build package
        shell: bash
        run: bash scripts/build.sh

      # 上传分发包 / Upload the distribution package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-ordering-system-macos
          path: dist/restaurant-ordering-system-macos.zip
          if-no-files-found: error
          retention-days: 30

  # Windows 产物 / Windows artifact
  build-windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      # 拉取源码 / Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装与本地一致的 Python 版本 / Install the same Python version as local
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 安装运行与打包依赖 / Install runtime and packaging dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      # 执行 Windows 一键打包脚本（cmd 才能直接运行 .bat）
      # Run the Windows packaging script (cmd is required to run a .bat)
      - name: Build package
        shell: cmd
        run: scripts\build.bat

      # 上传分发包 / Upload the distribution package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-ordering-system-windows
          path: dist/restaurant-ordering-system-windows.zip
          if-no-files-found: error
          retention-days: 30
